name: xtreamcodeapp
description: Nexora — cliente de streaming estilo Netflix para paneles Xtream Codes / XUI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  muxa_xtream: ^0.1.3
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  video_player: ^2.9.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  collection: ^1.18.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/demo/
